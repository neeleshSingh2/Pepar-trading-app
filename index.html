<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPAR TRADING - V3 ULTIMATE</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#07090c;color:#fff;padding-bottom:30px}
.top{background:#131722;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:2px solid #fcd535}
.top b{color:#fcd535;font-size:21px}.top span{color:#0ecb81;font-size:13px}
.tabs{display:flex;gap:8px;padding:10px;overflow-x:auto;white-space:nowrap}
.tab{padding:10px 18px;background:#1e222d;border-radius:20px;cursor:pointer;font-weight:bold;border:2px solid transparent}
.tab.active{background:#fcd535;color:#000}
.card{background:#131722;border-radius:14px;padding:14px;margin:0 10px 10px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.grid{grid-template-columns:280px 1fr 300px}.charts4{grid-template-columns:1fr 1fr}}
.coin{display:flex;justify-content:space-between;align-items:center;padding:11px;border-radius:10px;cursor:pointer;margin-bottom:6px;border:2px solid transparent;background:#1e222d}
.coin.active{border-color:#fcd535;background:#2a3040}
.coin small{color:#8b93a7}.up{color:#0ecb81}.down{color:#f6465d}
#mainChart{height:380px;background:#000;border-radius:10px;overflow:hidden}
.mini{height:180px;background:#000;border-radius:10px;overflow:hidden}
.charts4{display:grid;gap:10px;margin:10px}
.charts4 h4{margin-bottom:6px}
.indRow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ind{flex:1;min-width:100px;background:#1e222d;padding:12px;border-radius:10px;text-align:center}
.ind b{font-size:19px;display:block;margin-top:4px}
input{width:100%;padding:12px;border-radius:8px;border:none;background:#1e222d;color:#fff;font-size:16px;margin:8px 0}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:6px}
.buy{background:#0ecb81;color:#fff}.sell{background:#f6465d;color:#fff}
.badge{background:#fcd535;color:#000;padding:3px 8px;border-radius:6px;font-size:11px}
.ticker{background:#fcd535;color:#000;padding:8px 10px;overflow:hidden;white-space:nowrap;font-weight:bold}
.ticker span{margin-right:30px}
</style>
</head>

<div class="tab" onclick="switchTab('multi',this)">📊 4 CHART EK SATH</div>
</div>

<div id="coinList"></div>
</div>
